name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION_STR"
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "ERROR: Java version cannot be detected."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$JAVA_VERSION_STR" | cut -d'.' -f1)
          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Java major version cannot be extracted."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ] 2>/dev/null; then
            echo "ERROR: Active Java major version ($MAJOR_VERSION) is lower than 17."
            exit 1
          fi
          echo "Java environment verified: version $MAJOR_VERSION is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK not found at $TARGET_APK"
            echo "Listing APK files inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK file $TARGET_APK exists but is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: $TARGET_APK does not have .apk extension."; exit 1 ;;
          esac
          echo "Successfully verified expected APK at $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_BASE="${REPO_RAW##*/}"
          REPO_CLEAN=$(echo "$REPO_BASE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-zA-Z0-9._-]+/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="app"
          fi
          ASSET_NAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          TEMP_DIR="${RUNNER_TEMP:-/tmp}/release_asset"
          mkdir -p "$TEMP_DIR"
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TEMP_DIR/$ASSET_NAME"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Prepared release asset at $DEST_APK is missing or empty."
            exit 1
          fi
          echo "Prepared release asset: $DEST_APK ($(wc -c < "$DEST_APK") bytes)"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=Debug APK Build #${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: $ASSET_PATH does not have .apk extension."; exit 1 ;;
          esac
          TAG_NAME="${{ steps.prepare_asset.outputs.release_tag }}"
          TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          echo "Creating release with tag: $TAG_NAME and title: $TITLE"
          NOTES=$(cat <<'EOF'
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: #${{ github.run_attempt }}
          - **Commit SHA**: `${{ github.sha }}`
          - **Testing Notice**: This APK is intended for testing purposes only.
          - **Production Notice**: This APK is not a Play Store production release.
          - **Signing**: Signed only with a temporary debug keystore.

          Download the APK directly from the **Assets** section below.
          EOF
          )
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          TAG_NAME="${{ steps.prepare_asset.outputs.release_tag }}"
          TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $TITLE"
            echo "APK Asset Name: $ASSET_NAME"
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release URL: $RELEASE_URL"
            gh release view "$TAG_NAME" || true

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## :white_check_mark: Debug APK Built & Published Successfully

          - **Release Title**: $TITLE
          - **Release Tag**: \`$TAG_NAME\`
          - **Download APK**: Direct download is available under the [GitHub Release]($RELEASE_URL) **Assets** section.
          - **Asset Filename**: \`$ASSET_NAME\`
          - **Actions Artifact Backup**: The standard GitHub Actions artifact **\`app-debug-apk\`** is also available for download.
          EOF
          else
            echo "WARNING: GitHub Release publishing did not succeed (outcome: $RELEASE_OUTCOME)."
            echo "The debug APK was built successfully and is preserved as a GitHub Actions artifact."
            echo "Artifact Name: app-debug-apk"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## :warning: Debug APK Build Succeeded (Release Publishing Warning)

          - **APK Build Status**: Succeeded
          - **Actions Artifact**: **\`app-debug-apk\`** is available in the workflow run summary for download.
          - **Release Publishing**: GitHub Release creation was not completed. You can download the APK from the workflow artifacts above.
          EOF
          fi
